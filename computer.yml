---
- name: Personal computer playbook
  hosts: localhost
  connection: local

  # Homebrew 7 only loads formulae and casks from third-party taps once the
  # tap is trusted. geerlingguy.mac.homebrew doesn't pass `trust`, so set it
  # here for every tap it adds.
  module_defaults:
    community.general.homebrew_tap:
      trust: true

  roles:
    - { role: elliotweiser.osx-command-line-tools, tags: [clt] }
    - { role: geerlingguy.mac.homebrew, tags: [homebrew] }
    - { role: geerlingguy.mac.dock, tags: [dock] }
    - { role: shell, tags: [shell] }
    - { role: os, tags: [os] }
    - { role: editor, tags: [editor] }
    - { role: mise, tags: [mise] }
    - { role: apps, tags: [apps] }
    - { role: claude, tags: [claude] }
