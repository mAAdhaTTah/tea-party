---
- name: Personal computer playbook
  hosts: localhost
  connection: local

  # Ask for the sudo password only when a role that uses sudo runs: homebrew
  # (folder ownership, and casks that run sudo themselves) and shell
  # (/etc/shells, chsh). A role that starts using sudo must add its tag to both
  # tasks, or its runs fail on sudo instead of prompting.
  #
  # It's set as a variable rather than with -K: -K only feeds become, while
  # geerlingguy.mac.homebrew passes ansible_become_password to casks. Without
  # a TTY (CI) the pause doesn't wait, the variable stays unset, and sudo runs
  # passwordless.
  pre_tasks:
    - name: Ask for the sudo password
      pause:
        prompt: BECOME password
        echo: false
      register: become_prompt
      tags: [homebrew, shell]

    - name: Use the sudo password for become and casks
      set_fact:
        ansible_become_password: "{{ become_prompt.user_input }}"
      when: (become_prompt.user_input | default('')) | length > 0
      no_log: true
      tags: [homebrew, shell]

  roles:
    - { role: command_line_tools, tags: [clt] }
    - { role: geerlingguy.mac.homebrew, tags: [homebrew] }
    - { role: geerlingguy.mac.dock, tags: [dock] }
    - { role: shell, tags: [shell] }
    - { role: os, tags: [os] }
    - { role: editor, tags: [editor] }
    - { role: mise, tags: [mise] }
    - { role: apps, tags: [apps] }
    - { role: maadclankker, tags: [maadclankker] }
