---
- name: Personal computer playbook
  hosts: localhost
  connection: local

  # Prompt for the sudo password as a variable rather than with -K: -K only
  # feeds become, while geerlingguy.mac.homebrew passes ansible_become_password
  # to casks that run sudo themselves. Without a TTY (CI) Ansible skips the
  # prompt and falls back to passwordless sudo.
  vars_prompt:
    - name: ansible_become_password
      prompt: BECOME password
      private: true

  # Homebrew 7 only loads formulae and casks from third-party taps once the
  # tap is trusted. geerlingguy.mac.homebrew doesn't pass `trust`, so set it
  # here for every tap it adds.
  module_defaults:
    community.general.homebrew_tap:
      trust: true

  roles:
    - { role: command_line_tools, tags: [clt] }
    - { role: geerlingguy.mac.homebrew, tags: [homebrew] }
    - { role: geerlingguy.mac.dock, tags: [dock] }
    - { role: shell, tags: [shell] }
    - { role: os, tags: [os] }
    - { role: editor, tags: [editor] }
    - { role: mise, tags: [mise] }
    - { role: apps, tags: [apps] }
    - { role: claude, tags: [claude] }
