---
name: CI
# CI runs only when asked, to save Actions minutes (macOS is billed at ~10x
# Linux on private repos). Run it on a PR by adding the `ci` label (remove and
# re-add it to re-test new pushes), or on any branch, including main, with
# `gh workflow run CI --ref <branch>`.
"on":
  workflow_dispatch:
  pull_request:
    types: [labeled]

# One run per branch or PR: re-labelling a PR cancels its run still in
# progress. Dispatched runs aren't cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    # Any other label (e.g. Renovate's) starts a run that skips every job,
    # which uses no minutes.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint
  # Integration is slow and macOS runners are scarce, so it waits for Lint.
  integration:
    name: Integration
    needs: lint
    runs-on: macos-26

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Uninstall GitHub Actions' built-in Homebrew.
        run: tests/uninstall-homebrew.sh

      - name: Uninstall GitHub Actions' built-in browser installs.
        run: |
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app
      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Set up the test environment.
        run: |
          ansible-galaxy install -r requirements.yml
      - name: Test the playbook's syntax.
        run: ansible-playbook computer.yml --syntax-check

      - name: Test the playbook.
        run: ansible-playbook computer.yml -t all
        env:
          ANSIBLE_FORCE_COLOR: "1"

      - name: Idempotence check.
        run: |
          idempotence=$(mktemp)
          ansible-playbook computer.yml -t all | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: "1"
