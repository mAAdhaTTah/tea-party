---
name: CI
"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 4"

# One run per branch or PR: a new push cancels the run still in progress for
# the previous commit. Runs on main aren't cancelled, so each merge is linted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit. Its first parent is the base
          # branch, so depth 2 is enough to diff what the PR changes.
          fetch-depth: 2

      # Integration takes 30+ minutes, so skip it when a PR only changes files
      # the playbook doesn't read. Scheduled runs always run it. Integration
      # isn't a required check, so a skipped job doesn't block merging.
      - name: Check whether Integration needs to run.
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "${changed}"
          relevant=$(grep -vE '^(docs/.*|.*\.md|renovate\.json)$' <<< "${changed}" || true)
          if [ -n "${relevant}" ]; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, Markdown or renovate.json changed: skipping Integration."
            echo "integration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint
  # Integration is slow and macOS runners are scarce, so it waits for Lint and
  # skips pushes to main: the PR already ran it, and the weekly cron catches
  # drift. It also skips PRs that only change docs (see Lint).
  integration:
    name: Integration
    needs: lint
    if: github.event_name != 'push' && needs.lint.outputs.integration == 'true'
    runs-on: macos-26

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Uninstall GitHub Actions' built-in Homebrew.
        run: tests/uninstall-homebrew.sh

      # On macOS runners, resolving the runner's own *.local hostname through
      # the system resolver stalls for ~70s, even though dig answers at once.
      # Ansible's platform facts call socket.getfqdn() on every fact gather, so
      # each one stalled. A hostname with no hosts or DNS entry fails to
      # resolve immediately, and getfqdn() falls back to the bare name.
      - name: Give the runner a hostname that fails to resolve fast.
        run: sudo scutil --set HostName tea-party-ci

      - name: Uninstall GitHub Actions' built-in browser installs.
        run: |
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app
      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Set up the test environment.
        run: |
          ansible-galaxy install -r requirements.yml
      - name: Test the playbook's syntax.
        run: ansible-playbook computer.yml --syntax-check

      - name: Test the playbook.
        run: ansible-playbook computer.yml -t all
        env:
          ANSIBLE_FORCE_COLOR: "1"

      - name: Idempotence check.
        run: |
          idempotence=$(mktemp)
          ansible-playbook computer.yml -t all | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: "1"
