---
name: CI
"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 4"

# One run per branch or PR: a new push cancels the run still in progress for
# the previous commit. Runs on main aren't cancelled, so each merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint
  integration:
    name: Integration
    runs-on: macos-15

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Uninstall GitHub Actions' built-in Homebrew.
        run: tests/uninstall-homebrew.sh

      - name: Uninstall GitHub Actions' built-in browser installs.
        run: |
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app
      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies.
        run: pip3 install -r requirements-ci.txt

      - name: Set up the test environment.
        run: |
          ansible-galaxy install -r requirements.yml
      - name: Test the playbook's syntax.
        run: ansible-playbook computer.yml --syntax-check

      - name: Test the playbook.
        run: ansible-playbook computer.yml -t all
        env:
          ANSIBLE_FORCE_COLOR: "1"

      - name: Idempotence check.
        run: |
          idempotence=$(mktemp)
          ansible-playbook computer.yml -t all | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: "1"
