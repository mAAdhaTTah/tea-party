---
# Copied from https://github.com/geerlingguy/ansible-collection-mac/tree/master/roles/homebrew#role-variables
homebrew_prefix: "{{ (ansible_machine == 'arm64') | ternary('/opt/homebrew', '/usr/local') }}"
homebrew_taps: []
homebrew_installed_packages:
  - bash-completion
  - cloudflared
  - coreutils
  - curl
  - docker
  - docker-buildx
  - docker-compose
  - findutils
  - flyctl
  - gh
  - git
  - gnu-tar
  - jq
  - jump
  - neonctl
  - poppler
  - ripgrep
  - rsync
  - tea
  - trash
  - wget
homebrew_cask_apps:
  - 1password
  - 1password-cli
  - alfred
  - claude-code@latest
  - discord
  - firefox@developer-edition
  - flux-app
  - font-cutive-mono
  - font-fira-code-nerd-font
  - font-source-code-pro
  - ghostty
  - google-chrome
  - hazel
  - keybase
  - mountain-duck
  - obsidian
  - reader
  - rectangle
  - setapp
  - signal
  - slack
  - spotify
  - syncthing-app
  - t3-code
  - tailscale-app
  - todoist-app
  - transmit
  - whatsapp
  - zoom

# Homebrew 7 only loads formulae and casks from third-party taps once the tap
# is trusted, so these are tapped, trusted and installed by the
# homebrew_trusted role after geerlingguy.mac.homebrew
homebrew_trusted_taps:
  - name: athevon/tokeneater
    casks: [tokeneater]
  - name: jandedobbeleer/oh-my-posh
    formulae: [oh-my-posh]
  - name: moghtech/komodo
    formulae: [km]
