---
- name: Tap and trust third-party taps
  community.general.homebrew_tap:
    name: "{{ item.name }}"
    trust: true
    state: present
  loop: "{{ homebrew_trusted_taps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install formulae from third-party taps
  community.general.homebrew:
    name: "{{ item.0.name }}/{{ item.1 }}"
    state: present
  loop: "{{ homebrew_trusted_taps | subelements('formulae', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

- name: Install casks from third-party taps
  community.general.homebrew_cask:
    name: "{{ item.0.name }}/{{ item.1 }}"
    state: present
  loop: "{{ homebrew_trusted_taps | subelements('casks', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
