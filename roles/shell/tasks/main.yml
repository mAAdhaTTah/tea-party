---
- name: Install bash
  community.general.homebrew:
    name: bash
    state: present

- name: Add bash to the allowed shells
  become: true
  lineinfile:
    dest: /etc/shells
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    create: true
    mode: "0644"
  with_items:
    - { regexp: "^{{ homebrew_prefix }}/bin/bash", line: "{{ homebrew_prefix }}/bin/bash" }

- name: Register the current shell
  shell: echo $SHELL
  register: current_shell_result
  changed_when: false
  tags: [skip_ansible_lint]

- name: Change shell for the current user
  become: true
  shell: chsh -s {{ homebrew_prefix }}/bin/bash {{ lookup('env','USER') }}
  when: current_shell_result.stdout != (homebrew_prefix + "/bin/bash")
  changed_when: lookup('env','USER') != "runner"  # fix idempotence in CI
  tags: [skip_ansible_lint]

- name: Copy dotfiles
  template:
    src: "{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.{{ item }}"
    backup: true
    mode: "0644"
  with_items:
    - aliases
    - apps
    - bash_profile
    - bashrc
    - exports
    - functions
    - gitconfig
    - gitignore_global
    - path
    - ssh/config

- name: Install bash-it
  git:
    repo: https://github.com/Bash-it/bash-it.git
    dest: "{{ bash_it_install_path }}"
    version: v3.2.0
    # Its submodules are only bash-it's own test libraries
    recursive: false
  register: bash_it_checkout

- name: Create oh-my-posh config directory
  file:
    path: "{{ ansible_facts.env.HOME }}/.config/oh-my-posh"
    state: directory
    mode: "0755"

# copy, not template: the config is full of oh-my-posh's own {{ }} templates
- name: Copy oh-my-posh config
  copy:
    src: oh-my-posh/config.omp.json
    dest: "{{ ansible_facts.env.HOME }}/.config/oh-my-posh/config.omp.json"
    mode: "0644"

- name: Add bash-it to dotfiles
  blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.managed"
    create: true
    marker: "### {mark} ANSIBLE MANAGED BASH-IT CONFIG ###"
    mode: "0644"
    block: |
      # Check if running in interactive prompt
      if [[ $- == *i* ]]; then
        # Path to the bash it configuration
        export BASH_IT="{{ bash_it_install_path }}"

        # Lock and Load a custom theme file
        export BASH_IT_THEME="{{ bash_it_theme }}"
        if [ $BASH_IT_THEME = "oh-my-posh" ]; then
          export POSH_THEME="{{ posh_theme }}"
        fi
        # Load Bash It
        source $BASH_IT/bash_it.sh
      fi

# bash-it v3.1.0 moved the battery plugin into lib/, which always loads
- name: Uninstall the bash-it battery plugin
  file:
    path: "{{ bash_it_install_path }}/enabled/250---battery.plugin.bash"
    state: absent

# bash-it only loads in interactive shells (see the BASH-IT block), hence -i
- name: Install bash-it aliases, completions, and plugins
  command: /usr/bin/env bash -l -i -c "bash-it enable {{ item.to_enable }} {{ item.list | join(' ') }}"
  register: result
  changed_when: result.stdout_lines | reject('match', '.* is already enabled.') | list | length > 0
  # bash-it exits 0 when asked to enable a component that doesn't exist
  failed_when: result.rc != 0 or 'does not appear to be an available' in result.stdout
  with_items:
    - { to_enable: plugin, list: "{{ bash_it_plugins }}" }
    - { to_enable: completion, list: "{{ bash_it_completions }}" }
    - { to_enable: alias, list: "{{ bash_it_aliases }}" }
  tags: [skip_ansible_lint]

# Upstream removals leave dangling symlinks behind, and `bash-it migrate`
# only handles the legacy per-type enabled directories, so prune them here
# (after enabling, which creates the enabled directory on a fresh install)
- name: Remove bash-it components that no longer exist
  command: find -L {{ bash_it_install_path }}/enabled -type l -print -delete
  register: bash_it_pruned
  changed_when: bash_it_pruned.stdout | length > 0
