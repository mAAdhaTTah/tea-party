---
- name: Create Claude Code config directory
  file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: "0755"

# Claude Code writes to this file itself, so only seed it on a fresh machine
- name: Seed Claude Code settings
  copy:
    src: settings.json
    dest: "{{ ansible_facts.env.HOME }}/.claude/settings.json"
    force: false
    mode: "0644"

# The add/install steps below warn rather than stop the play when they fail,
# e.g. the maadclankker marketplace needs your SSH key
- name: List Claude Code plugin marketplaces
  command: "{{ claude_bin }} plugin marketplace list --json"
  register: claude_marketplace_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add Claude Code plugin marketplaces
  command: "{{ claude_bin }} plugin marketplace add {{ item.source }}"
  loop: "{{ claude_marketplaces }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (claude_marketplace_list.stdout | default('[]', true) | from_json | map(attribute='name') | list)
  # Give up quickly on an unreachable SSH host (e.g. off the tailnet, or in CI)
  # instead of hanging until the OS gives up
  environment:
    GIT_SSH_COMMAND: ssh -o ConnectTimeout=10
  register: claude_marketplace_add
  changed_when: claude_marketplace_add.rc == 0
  failed_when: false

- name: Warn about Claude Code marketplaces that couldn't be added
  debug:
    msg: "Couldn't add the {{ item.item.name }} marketplace: {{ item.stderr | default(item.stdout) }}"
  loop: "{{ claude_marketplace_add.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: List Claude Code plugins
  command: "{{ claude_bin }} plugin list --json"
  register: claude_plugin_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Claude Code plugins
  command: "{{ claude_bin }} plugin install {{ item }} --scope user"
  loop: "{{ claude_plugins }}"
  when: >-
    item not in (claude_plugin_list.stdout | default('[]', true) | from_json
    | selectattr('scope', 'equalto', 'user') | map(attribute='id') | list)
  register: claude_plugin_install
  changed_when: claude_plugin_install.rc == 0
  failed_when: false

- name: Warn about Claude Code plugins that couldn't be installed
  debug:
    msg: "Couldn't install {{ item.item }}: {{ item.stderr | default(item.stdout) }}"
  loop: "{{ claude_plugin_install.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

# User-scope MCP servers live under mcpServers in ~/.claude.json. Reading it
# directly avoids `claude mcp get`, which health-checks each server over the
# network
- name: Read the Claude Code user config
  slurp:
    src: "{{ ansible_facts.env.HOME }}/.claude.json"
  register: claude_user_config
  failed_when: false
  no_log: true

- name: Find the configured Claude Code MCP servers
  set_fact:
    claude_mcp_configured: >-
      {{ ((claude_user_config.content | default('') | b64decode or '{}')
      | from_json).mcpServers | default({}) | list }}

# Authenticating each server is a manual step (/mcp in Claude Code)
- name: Add Claude Code MCP servers
  command: "{{ claude_bin }} mcp add --scope user --transport http {{ item.name }} {{ item.url }}"
  loop: "{{ claude_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in claude_mcp_configured
  register: claude_mcp_add
  changed_when: claude_mcp_add.rc == 0
  failed_when: false

- name: Warn about Claude Code MCP servers that couldn't be added
  debug:
    msg: "Couldn't add the {{ item.item.name }} MCP server: {{ item.stderr | default(item.stdout) }}"
  loop: "{{ claude_mcp_add.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create Cognee config directory
  file:
    path: "{{ cognee_env_path | dirname }}"
    state: directory
    mode: "0755"

- name: Read the Cognee plugin config
  slurp:
    src: "{{ cognee_env_path }}"
  register: cognee_env
  failed_when: false
  no_log: true

# Reuse this machine's key so re-runs don't mint a new one each time
- name: Find this machine's Cognee API key
  set_fact:
    cognee_api_key: >-
      {{ (cognee_env.content | default('') | b64decode
      | regex_search('(?m)^COGNEE_API_KEY="?([^"\s]+)', '\1') or [''])[0] }}
  no_log: true

# The server sits on the tailnet, so minting a key needs no login
- name: Mint a Cognee API key for this machine
  uri:
    url: "{{ cognee_base_url }}/api/v1/auth/api-keys"
    method: POST
    body_format: json
    body:
      name: "{{ ansible_facts.hostname }}"
    status_code: [200, 201]
  register: cognee_mint
  when: cognee_api_key | length == 0
  failed_when: false
  no_log: true

- name: Warn when the Cognee API key couldn't be minted
  debug:
    msg: "Skipping the Cognee plugin config: minting an API key failed (is Tailscale up?)"
  when: cognee_api_key | length == 0 and (cognee_mint.json.key | default('')) | length == 0

- name: Write the Cognee plugin config
  vars:
    cognee_key: "{{ cognee_api_key or (cognee_mint.json.key | default('')) }}"
  copy:
    content: |
      COGNEE_BACKEND=cloud
      COGNEE_BASE_URL="{{ cognee_base_url }}"
      COGNEE_API_KEY="{{ cognee_key }}"
      COGNEE_PLUGIN_DATASET={{ cognee_dataset }}
    dest: "{{ cognee_env_path }}"
    mode: "0600"
  when: cognee_key | length > 0
  diff: false
  no_log: true
