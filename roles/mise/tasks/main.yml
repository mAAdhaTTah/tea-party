---
- name: Install mise
  community.general.homebrew:
    name: mise
    state: present

- name: Create mise config directory
  file:
    path: "{{ mise_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: Copy mise config
  template:
    src: config.toml.j2
    dest: "{{ mise_config_path }}"
    backup: true
    mode: "0644"

# mise has to activate before bash-it, whose npm completion runs npm at load.
# blockinfile won't move an existing block, so drop one that sits after bash-it.
- name: Read dotfiles to check mise block order
  slurp:
    src: "{{ ansible_facts.env.HOME }}/.managed"
  register: managed_dotfile
  failed_when: false

- name: Remove mise block that loads after bash-it
  blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.managed"
    marker: "### {mark} ANSIBLE MANAGED MISE CONFIG ###"
    state: absent
  vars:
    managed_content: "{{ managed_dotfile.content | default('') | b64decode }}"
  when: >-
    managed_content.find('### BEGIN ANSIBLE MANAGED MISE CONFIG ###')
    > managed_content.find('### BEGIN ANSIBLE MANAGED BASH-IT CONFIG ###')
    >= 0

- name: Add mise to dotfiles
  blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.managed"
    create: true
    mode: "0644"
    marker: "### {mark} ANSIBLE MANAGED MISE CONFIG ###"
    insertbefore: "### BEGIN ANSIBLE MANAGED BASH-IT CONFIG ###"
    block: |
      if [[ $- == *i* ]]; then
        eval "$(mise activate bash)"
        eval "$(uv generate-shell-completion bash)"
      else
        eval "$(mise activate bash --shims)"
      fi

- name: Install mise tools
  command: "{{ homebrew_prefix }}/bin/mise install"
  args:
    chdir: "{{ ansible_facts.env.HOME }}"
  register: mise_install
  changed_when: "'installed 0 tools' not in (mise_install.stdout + mise_install.stderr)"

- name: Create rust bash completions
  shell: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup completions bash > {{ rustup_completions }}"
  args:
    creates: "{{ rustup_completions }}"
